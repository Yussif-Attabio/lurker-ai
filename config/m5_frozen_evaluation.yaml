decision_contract:
  question: >-
    Given the recent conversation and latest message, what should Lurker do?
    Choose REPLY only if someone needs an answer or help that nobody has given
    yet. Otherwise, choose REACT if a brief emoji would meaningfully acknowledge
    a noteworthy achievement, gratitude, support, or shared humor. Otherwise
    choose SILENT, including for routine updates, ordinary back-and-forth,
    already-handled points, or when a reaction would add noise.
  options: [SILENT, REACT, REPLY]
  context_state:
    agent_name: Lurker
    recent_messages: last_3_messages_before_latest
    latest_message: current_message
  action_policy:
    SILENT: Always remains SILENT.
    REACT: Remains REACT when confidence is at least 0.04; otherwise SILENT.
    REPLY: Remains REPLY when confidence is at least 0.20; otherwise SILENT.
    ERROR_OR_UNKNOWN: Fail closed to SILENT.

final_evaluation:
  dataset_split: heldout
  expected_scenarios: 15
  context_values: [0, 3, 5]
  expected_decider_predictions: 45
  primary_context_k: 3
  comparison_only_contexts: [0, 5]
  one_time_run: true
  rerun_policy: No rerun or retuning after viewing results; preserve failures and record NO-GO.
  thresholds_apply_unchanged_to_all_contexts: true

metrics:
  label_dependent_denominator: unanimous_non_ambiguous_cases_only
  accuracy: final_action_equals_consensus / non_ambiguous_cases
  unnecessary_interruption_rate: consensus_SILENT_predicted_REACT_or_REPLY / consensus_SILENT_cases
  missed_help_rate: consensus_REPLY_predicted_SILENT_or_REACT / consensus_REPLY_cases
  react_precision: correct_REACT_predictions / all_REACT_predictions_among_non_ambiguous_cases
  react_recall: correct_REACT_predictions / unanimous_REACT_cases
  latency: report_p50_and_p95_over_all_cases
  error_count: report_over_all_cases
  calibration_bins: [0.0-0.5, 0.5-0.7, 0.7-0.9, 0.9-1.0]
  ambiguous_labels:
    value: AMBIGUOUS
    excluded_from: [accuracy, unnecessary_interruption_rate, missed_help_rate, react_precision, react_recall, calibration_accuracy]
    included_in: [prediction_completeness, prediction_counts, latency, error_count, separate_ambiguous_listing]

success_gates:
  evaluated_only_at_primary_context_k: 3
  accuracy_min: 0.70
  unnecessary_interruption_rate_max: 0.20
  missed_help_rate_max: 0.25
  decider_error_count_max: 0
  expected_predictions_required: 45
  mock_rows_allowed: 0
  react_precision_threshold: null
  react_recall_threshold: null
  latency_threshold_ms: null
  note: REACT precision, REACT recall, and latency are mandatory reports but are not post-hoc pass/fail gates.

