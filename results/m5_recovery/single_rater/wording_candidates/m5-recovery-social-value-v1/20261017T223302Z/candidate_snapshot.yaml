decision_contract:
  question: 'Decide what Lurker should do for the latest message in its recent context.
    Apply this priority order. Choose REPLY when the latest message directly or indirectly
    asks for information, help, judgment, clarification, or action that remains unresolved.
    Do not choose REPLY merely because an earlier message was a question when the
    latest message answers it or gives a self-contained update. If no reply is needed,
    choose REACT when one brief emoji would add meaningful social value by acknowledging
    a concrete achievement or beneficial impact, sincere gratitude or support, important
    personal news, a significant setback or recovery moment, belonging or welcome,
    or clearly shared humor. Meaningful moments can merit REACT without an exclamation
    mark, emoji, or celebratory wording. Do not choose REACT for ordinary positivity,
    routine results, reciprocal politeness, conversational closure, or an acknowledgment
    whose only effect would be noise. Choose SILENT for those routine or already-handled
    cases and whenever neither an unresolved need nor meaningful acknowledgment is
    present. Tie-breakers: unresolved need means REPLY; no reply needed but clear
    social value means REACT; otherwise SILENT. Judge meaning and context, not punctuation
    alone.'
  options:
  - SILENT
  - REACT
  - REPLY
